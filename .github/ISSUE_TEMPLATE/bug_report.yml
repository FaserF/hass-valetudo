name: Bug Report
description: Report a bug with the Valetudo integration for Home Assistant
title: '[Bug]: '
labels: ['bug', 'triage']
assignees:
  - FaserF
body:
  - type: markdown
    attributes:
      value: |
        ## Before you open a bug report
        - 🔍 Search [existing issues](https://github.com/FaserF/hass-valetudo/issues) first — your bug may already be reported
        - 📖 Read the [documentation](https://github.com/FaserF/hass-valetudo/blob/master/README.md)
        - 🔗 Check the integration on your HA instance: [![Open your Home Assistant instance and show an integration.](https://my.home-assistant.io/badges/integration.svg)](https://my.home-assistant.io/redirect/integration/?domain=valetudo)

  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      description: Which version of the hass-valetudo integration are you running?
      placeholder: v2026.8.0
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      description: |
        [![Open your Home Assistant instance and show your Home Assistant version information.](https://my.home-assistant.io/badges/info.svg)](https://my.home-assistant.io/redirect/info/)
      placeholder: 2026.7.4
    validations:
      required: true

  - type: dropdown
    id: ha_installation_type
    attributes:
      label: Home Assistant Installation Type
      options:
        - Home Assistant OS
        - Home Assistant Container
        - Home Assistant Supervised
        - Home Assistant Core
    validations:
      required: true

  - type: input
    id: valetudo_version
    attributes:
      label: Valetudo Version
      description: Which version of Valetudo is running on your robot?
      placeholder: 2026.08.0
    validations:
      required: true

  - type: input
    id: robot_model
    attributes:
      label: Robot Model / Brand
      description: What robot vacuum are you using?
      placeholder: e.g. Roborock S5, Dreame D9, Mijia
    validations:
      required: true

  - type: dropdown
    id: valetudo_variant
    attributes:
      label: Valetudo Variant
      description: Which variant of Valetudo are you running?
      options:
        - Valetudo (standard)
        - Valetudo RE
    validations:
      required: true

  - type: dropdown
    id: connection_type
    attributes:
      label: Connection Type
      description: How does the integration communicate with Valetudo?
      options:
        - MQTT
        - HTTP API
    validations:
      required: true

  - type: textarea
    id: describe_bug
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic Information
      description: |
        [![Open your Home Assistant instance and show the diagnostics for your integration.](https://my.home-assistant.io/badges/diagnostics.svg)](https://my.home-assistant.io/redirect/diagnostics/)

        Paste the diagnostic YAML here (optional but very helpful).
      render: yaml
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Enable debug logging and paste relevant output here. Go to **Settings → System → Logs**.
      render: shell
    validations:
      required: false
